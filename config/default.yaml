version: "1.0"

system:
  environment: "default"
  log_level: "INFO"
  data_dir: "data"

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  buffer_queue_size: 50
  speaker_sample_rate: 22050

wakeword:
  provider: "openwakeword"
  model_name: "hey_jarvis"
  threshold: 0.5
  sample_rate: 16000

vad:
  energy_threshold: 0.008
  silence_duration_ms: 1800
  speech_pad_ms: 300

stt:
  provider: "faster_whisper"
  model: "base"
  language: "auto"
  device: "cpu"
  compute_type: "int8"
  cloud_fallback: false

llm:
  provider: "ollama"
  model: "hermes3:3b"
  temperature: 0.7
  max_tokens: 1024
  stream: true
  system_prompt: "You are Vidya, a helpful local voice assistant. Keep all responses brief (1 to 2 sentences maximum), clear, and natural for speech synthesis."

tts:
  provider: "edge_tts"
  voice: "en-US-AvaMultilingualNeural"
  speaker_id: 0
  speed: 1.15
  auto_switch_voice: false
  chunk_queue_size: 20

session:
  max_history_turns: 0
  save_audio_logs: false

observability:
  enable_metrics: true
  enable_timeline: true
